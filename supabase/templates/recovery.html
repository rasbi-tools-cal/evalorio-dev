<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f8f9ff;font-family:Inter,Arial,sans-serif;color:#0b1c30">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #d9e2dc;border-radius:12px;padding:32px">
          <tr><td style="font-size:22px;font-weight:700;padding-bottom:16px">Evalorio</td></tr>
          <tr><td style="font-size:18px;font-weight:600;padding-bottom:8px">Reset your password</td></tr>
          <tr><td style="font-size:15px;line-height:24px;color:#3d4a42;padding-bottom:24px">We received a request to reset your Evalorio password. The link is valid for one hour.</td></tr>
          <tr><td style="padding-bottom:24px">
            <a href="{{ .SiteURL }}/api/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}"
               style="display:inline-block;background:#006948;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:8px">Choose a new password</a>
          </td></tr>
          <tr><td style="font-size:13px;line-height:20px;color:#565e74">If you didn't request this, you can safely ignore this email.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
